server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Photos are re-encoded server-side, but cap request size anyway.
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # API: /api/... -> backend /...
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # The live activity feed is Server-Sent Events: never buffer it.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/report, /admin/alerts, ...) all serve the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
